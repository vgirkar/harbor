name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LLM_PROVIDER: fake
      EMBEDDINGS_PROVIDER: fake
      SPEECH_PROVIDER: fake
      RERANKER: none
      DATABASE_URL: postgresql+psycopg://harbor:harbor@localhost:5432/harbor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,evals]"
      - run: ruff check harbor tests
      - run: pytest tests/unit -q
      - run: pytest tests/integration -q -m integration
      - run: harbor eval --offline --out evals/reports
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t harbor:ci .
