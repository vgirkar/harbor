[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor"
version = "1.0.0"
description = "Production RAG + multi-agent customer support assistant (text and voice) on LangGraph, Claude, pgvector and Pinecone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinit Girkar" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-voyageai>=0.1.6",
  "langchain-text-splitters>=0.3",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "pinecone>=6.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "tenacity>=8.3",
  "orjson>=3.10",
]

[project.optional-dependencies]
evals = ["ragas>=0.4", "instructor>=1.7"]
openai = ["langchain-openai>=0.3"]
free = ["fastembed>=0.4", "langchain-openai>=0.3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
harbor = "harbor.cli:app"

[tool.setuptools.packages.find]
include = ["harbor*"]

[tool.setuptools.package-data]
harbor = ["prompts/*.md", "evals/data/*.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["harbor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
